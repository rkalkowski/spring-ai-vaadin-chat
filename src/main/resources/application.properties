spring.application.name=spring-ai-vaadin-chat

# ---------------------------------------------------------------------------
# LLM provider. Export ANTHROPIC_API_KEY before starting; never commit a key.
# Swap the starter in pom.xml (and this prefix) to use OpenAI, Ollama, etc.
# ---------------------------------------------------------------------------
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.anthropic.chat.options.model=claude-sonnet-5
spring.ai.anthropic.chat.options.max-tokens=1024
spring.ai.anthropic.chat.options.temperature=0.3

# Local ONNX embedding model for RAG (no API key needed).
# The model is downloaded on first startup and cached.
spring.ai.embedding.transformer.onnx.gpu-device-id=-1

# Vaadin: keep the dev bundle in the project so the first start is faster.
vaadin.launch-browser=true

# Token metrics show up at /actuator/metrics/ai.tokens
management.endpoints.web.exposure.include=health,info,metrics
