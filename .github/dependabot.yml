version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Spring Boot and Spring AI must move together — a Boot bump without the
      # matching Spring AI line is the most likely way to break this project.
      spring:
        patterns:
          - "org.springframework.*"
      vaadin:
        patterns:
          - "com.vaadin:*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
